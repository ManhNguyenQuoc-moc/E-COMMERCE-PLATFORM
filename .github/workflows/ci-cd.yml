name: CI/CD Pipeline (Develop Environment)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-build-and-test:
    name: Build & Run Unit Tests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: dotnet test EcommercePlatform.sln -c Release --verbosity normal

  cd-deploy-dev:
    name: Deploy to Dev Lab Environment
    needs: ci-build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux]
    env:
      DB_NAME: EcommercePlatformDevDb
      DB_USER: sa
      DB_SA_PASSWORD: ${{ secrets.DB_SA_PASSWORD }}
      ConnectionStrings__Redis: redis-dev:6379,abortConnect=false
      Jwt__Issuer: EcommercePlatform.Api
      Jwt__Audience: EcommercePlatform.Client
      Jwt__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
      Jwt__ExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "7"
      ASPNETCORE_ENVIRONMENT: Development
      CORS_ALLOWED_ORIGINS: "*"
    steps:
      - uses: actions/checkout@v4

      - name: Load Local .env.dev Fallback if GitHub Secrets Unset
        run: |
          if [ -z "$DB_SA_PASSWORD" ] && [ -f /mnt/d/MebiSoft/E-COMMERCE-PLATFORM/.env.dev ]; then
            grep -v '^#' /mnt/d/MebiSoft/E-COMMERCE-PLATFORM/.env.dev | grep -v '^$' >> "$GITHUB_ENV"
          fi

      - name: Deploy Docker Stack & Wait Healthy
        run: docker compose -p ecommerce-dev -f docker-compose.dev.yml up -d --build --wait

      - name: Apply EF Core Migrations
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install --global dotnet-ef || true
          dotnet ef database update \
            --project src/EcommercePlatform.Infrastructure \
            --startup-project src/EcommercePlatform.Api \
            --connection "Server=127.0.0.1,11433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"

      - name: Smoke Test & Print Public Tunnel URL
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused -fsS http://localhost:5080/health
          TUNNEL_URL=$(docker logs ecommerce_dev_tunnel 2>&1 | grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' | head -n 1)
          echo "LIVE PUBLIC API: $TUNNEL_URL"
          {
            echo "### 🚀 Live Public API Deployment (Cloudflare Tunnel)"
            echo "- **Swagger UI:** [Open Swagger UI]($TUNNEL_URL/swagger/index.html)"
            echo "- **Health Check:** [Check Health]($TUNNEL_URL/health)"
          } >> "$GITHUB_STEP_SUMMARY"
