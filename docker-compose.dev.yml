services:
  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce_dev_sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:-YourStrong@Password123!}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - sqlserver_dev_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis-dev:
    image: redis:7.4-alpine
    container_name: ecommerce_dev_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:dev
    container_name: ecommerce_dev_api
    restart: unless-stopped
    depends_on:
      sqlserver-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver-dev,1433;Database=EcommercePlatformDevDb;User Id=sa;Password=${DB_SA_PASSWORD:-YourStrong@Password123!};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__Redis: "redis-dev:6379,abortConnect=false"
      Jwt__Issuer: "EcommercePlatform.Api"
      Jwt__Audience: "EcommercePlatform.Client"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-SUPER_SECRET_DEV_KEY_AT_LEAST_32_CHARS_LONG!}"
      Jwt__ExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "7"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ecommerce_dev_tunnel
    restart: unless-stopped
    command: tunnel --url http://api-dev:8080
    depends_on:
      - api-dev

volumes:
  sqlserver_dev_data:
    driver: local
  redis_dev_data:
    driver: local
