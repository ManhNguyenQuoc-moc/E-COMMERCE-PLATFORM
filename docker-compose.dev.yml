services:
  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce_dev_sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - sqlserver_dev_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis-dev:
    image: redis:7.4-alpine
    container_name: ecommerce_dev_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:dev
    container_name: ecommerce_dev_api
    restart: unless-stopped
    depends_on:
      sqlserver-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver-dev,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__Redis: "${ConnectionStrings__Redis}"
      Jwt__Issuer: "${Jwt__Issuer}"
      Jwt__Audience: "${Jwt__Audience}"
      Jwt__SecretKey: "${Jwt__SecretKey}"
      Jwt__ExpiryMinutes: "${Jwt__ExpiryMinutes}"
      Jwt__RefreshTokenExpiryDays: "${Jwt__RefreshTokenExpiryDays}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGINS}"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ecommerce_dev_tunnel
    restart: unless-stopped
    command: tunnel --url http://api-dev:8080
    depends_on:
      - api-dev

  db-web:
    image: dbeaver/cloudbeaver:latest
    container_name: ecommerce_dev_db_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    depends_on:
      sqlserver-dev:
        condition: service_healthy
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

volumes:
  sqlserver_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  cloudbeaver_data:
    driver: local
